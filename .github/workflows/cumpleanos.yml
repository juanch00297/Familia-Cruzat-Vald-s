name: Recordatorio Diario de Cumpleaños

on:
  schedule:
    - cron: '0 11 * * *' # 8:00 AM hora Chile (verano) / 7:00 AM (invierno)
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Enviar ahora a TODOS los suscriptores (true = siempre envía)'
        required: false
        default: 'true'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin nodemailer
      - run: node send_emails.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
