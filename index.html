<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Familia Cruzat Valdés — Cumpleaños y Árbol</title>
<style>
  :root {
    --primary: #0f62fe;
    --primary-dark: #0043ce;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 16px 40px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }

  /* Header */
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    background: var(--card);
    padding: 18px 22px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .brand h1 { margin: 0; font-size: 1.45rem; color: var(--text); letter-spacing: -0.02em; }
  .brand-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 5px; font-size: 0.85rem; color: var(--muted); }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600;
    background: #f1f5f9; color: #475569; border: 1px solid var(--border);
  }
  .sync-pill.ok { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .sync-pill.warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }

  .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: #fff; border: 1px solid #cbd5e1; color: var(--text);
    padding: 8px 13px; border-radius: 10px; cursor: pointer;
    font-weight: 600; font-size: 0.86rem; transition: all 0.15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #f8fafc; border-color: #94a3b8; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-danger { background: #fff1f2; color: #be123c; border-color: #fecdd3; }
  .btn-danger:hover { background: #ffe4e6; }
  .btn-admin { background: #fffbeb; border-color: #f59e0b; color: #92400e; }
  .btn-admin.unlocked { background: #ecfdf5; border-color: #10b981; color: #065f46; }

  /* Tabs */
  .tabs {
    display: inline-flex; gap: 6px; background: #e2e8f0; padding: 4px;
    border-radius: 12px; margin-bottom: 18px;
  }
  .tab-btn {
    background: transparent; border: none; padding: 8px 18px;
    font-size: 0.92rem; font-weight: 600; color: #475569;
    cursor: pointer; border-radius: 9px; transition: all 0.15s ease;
  }
  .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .view-section { display: none; }
  .view-section.active { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Próximos cumpleaños */
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
  }
  .section-title {
    margin: 0 0 12px; font-size: 1rem; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  #upcomingList { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .upcomingCard {
    min-width: 215px; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem;
    transition: transform 0.15s ease;
  }
  .upcomingCard:hover { transform: translateY(-2px); border-color: #cbd5e1; }
  .upcomingCard.is-today { background: #fffbeb; border: 1.5px solid #f59e0b; }
  .countdown-tag {
    align-self: flex-start; font-size: 0.72rem; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; background: #e0f2fe; color: #0369a1;
  }
  .upcomingCard.is-today .countdown-tag { background: #f59e0b; color: #fff; }

  /* Buscador */
  .search-wrap { position: relative; max-width: 420px; margin-bottom: 14px; }
  .search-bar {
    width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 0.92rem; background: #fff; outline: none; transition: border-color 0.15s;
  }
  .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,98,254,0.12); }
  #searchResults { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

  /* Navegación meses */
  #monthNav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #monthNav button {
    background: #fff; border: 1px solid var(--border); padding: 7px 12px;
    border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 0.84rem;
    color: #334155; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
  }
  #monthNav button:hover:not(.active) { background: #f8fafc; border-color: #94a3b8; }
  #monthNav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  #monthNav button .m-count {
    font-size: 0.72rem; opacity: 0.78; background: rgba(0,0,0,0.08);
    padding: 1px 6px; border-radius: 999px;
  }
  #monthNav button.active .m-count { background: rgba(255,255,255,0.22); opacity: 1; }

  /* Grilla Calendario */
  .weekdays-header {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    margin-bottom: 8px; text-align: center; font-size: 0.78rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day {
    min-height: 92px; padding: 8px; border-radius: 10px;
    background: #f8fafc; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem;
  }
  .day.inactive { background: #f1f5f9; border-color: transparent; opacity: 0.45; }
  .day.today { background: #fffbeb; border: 2px solid #f59e0b; }
  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .day .num { font-weight: 700; color: #334155; }
  .day.today .num { color: #b45309; }
  .day .weekday-mobile { display: none; font-size: 0.75rem; color: var(--muted); text-transform: capitalize; }

  /* Badges categorías */
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 8px;
    font-size: 0.75rem; color: #fff; font-weight: 600; cursor: pointer;
    line-height: 1.25; transition: transform 0.12s, opacity 0.12s;
    word-break: break-word;
  }
  .badge:hover { opacity: 0.9; transform: scale(1.02); }
  .Abuelos { background: #eab308; color: #1e293b; }
  .Tio { background: #2563eb; }
  .Nieto { background: #16a34a; }
  .Bisnieto { background: #ec4899; }
  .Casado { background: #7c3aed; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84rem; color: var(--muted);
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }

  /* ================= ÁRBOL GENEALÓGICO ================= */
  .tree-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .tree-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .zoom-label { font-size: 0.82rem; font-weight: 700; color: var(--muted); min-width: 44px; text-align: center; }

  .tree-viewport {
    background: #f8fafc;
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    min-height: 460px;
    max-height: 74vh;
    padding: 28px 24px 40px;
    cursor: grab;
    user-select: none;
    position: relative;
  }
  .tree-viewport.grabbing { cursor: grabbing; }

  /* Solución al bug de overflow en flexbox: width: max-content + margin auto */
  .tree-stage {
    width: max-content;
    margin: 0 auto;
    transform-origin: top left;
    transition: transform 0.15s ease;
  }

  .tree ul {
    padding-top: 26px; position: relative; display: flex; justify-content: center;
    margin: 0; padding-left: 0; list-style: none;
  }
  .tree > ul { padding-top: 0; }
  .tree li {
    display: flex; flex-direction: column; align-items: center;
    position: relative; padding: 26px 8px 0 8px;
  }
  .tree > ul > li { padding-top: 0; }

  /* Líneas conectoras */
  .tree li::before, .tree li::after {
    content: ''; position: absolute; top: 0; right: 50%;
    border-top: 2px solid #cbd5e1; width: 50%; height: 26px;
  }
  .tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
  .tree li:only-child::after, .tree li:only-child::before { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
  .tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 8px 0 0; }
  .tree li:first-child::after { border-radius: 8px 0 0 0; }
  .tree ul ul::before {
    content: ''; position: absolute; top: 0; left: 50%;
    border-left: 2px solid #cbd5e1; width: 0; height: 26px;
  }
  .tree ul.collapsed { display: none; }

  /* Tarjeta nodo del árbol */
  .person-node {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 12px; border-radius: 12px; background: #fff;
    border: 1px solid #cbd5e1; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    width: 178px; text-align: center; position: relative; z-index: 2;
  }
  .person-node.abuelos-node {
    background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
    border: 2px solid #f59e0b; width: 235px;
  }
  .person-node strong { font-size: 0.85rem; line-height: 1.25; color: var(--text); }
  .person-meta { font-size: 0.74rem; color: var(--muted); }
  .spouse-tag {
    font-size: 0.75rem; color: #5b21b6; background: #f5f3ff;
    border: 1px solid #ddd6fe; padding: 4px 8px; border-radius: 8px;
    margin-top: 3px; width: 100%; line-height: 1.25;
  }
  .branch-toggle {
    margin-top: 6px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8;
    border-radius: 999px; padding: 3px 10px; font-size: 0.73rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .branch-toggle:hover { background: #dbeafe; }

  .edit-icon {
    cursor: pointer; font-size: 0.72rem; padding: 2px 7px; border-radius: 6px;
    background: #fff; border: 1px solid #93c5fd; color: #1d4ed8;
    display: none; margin-top: 3px; font-weight: 600;
  }
  body.is-admin .edit-icon { display: inline-block; }

  .unlinked-box {
    margin-top: 18px; padding: 16px; background: #fff;
    border: 1.5px dashed #cbd5e1; border-radius: 12px;
  }
  .unlinked-box h4 { margin: 0 0 10px; color: #475569; font-size: 0.9rem; }
  .unlinked-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .unlinked-list .person-node { width: 165px; }

  /* Modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(2px); justify-content: center; align-items: center;
    z-index: 200; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 450px;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25); max-height: 92vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px; color: var(--text); font-size: 1.15rem; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 4px; }
  .form-group input, .form-group select {
    width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 0.9rem; background: #fff;
  }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 18px; }
  .modal-actions-right { display: flex; gap: 8px; margin-left: auto; }

  /* Responsive móvil: calendario pasa a lista limpia de días con cumpleaños */
  @media (max-width: 760px) {
    header { padding: 14px 16px; }
    .brand h1 { font-size: 1.2rem; }
    .weekdays-header { display: none; }
    .calendar-grid { grid-template-columns: 1fr; gap: 8px; }
    .day.inactive { display: none; }
    .day.no-events:not(.today) { display: none; }
    .day { min-height: auto; padding: 10px 12px; }
    .day .weekday-mobile { display: inline; }
  }
</style>
</head>

<header>
  <div class="brand">
    <h1>🎂 Familia Cruzat Valdés</h1>
    <div class="brand-meta">
      <span id="today"></span>
      <span>•</span>
      <span id="statsLabel">Cargando...</span>
      <span id="syncStatus" class="sync-pill">⚡ Cargando...</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" onclick="subscribeEmail()">🔔 Avisos por correo</button>
    <button id="btnAdmin" class="btn btn-admin" onclick="toggleAdmin()">🔒 Modo Admin</button>
    <button id="btnAdd" class="btn btn-primary" style="display:none;" onclick="openModal()">+ Agregar</button>
    <button id="btnSeed" class="btn" style="display:none;" onclick="syncInitialToFirebase()">☁️ Sincronizar base</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('calendar', this)">📅 Calendario</button>
  <button class="tab-btn" onclick="switchTab('tree', this)">🌳 Árbol Genealógico</button>
</div>

<!-- VISTA CALENDARIO -->
<div id="view-calendar" class="view-section active">
  <section class="card">
    <h3 class="section-title">
      <span>🎉 Próximos 14 días</span>
    </h3>
    <div id="upcomingList"></div>
  </section>

  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar familiar por nombre..." oninput="renderSearch()">
  </div>
  <div id="searchResults"></div>

  <section id="monthNav"></section>

  <section class="card">
    <div id="monthsContainer"></div>
    <div class="legend">
      <div class="legend-item"><span class="badge Abuelos">Abuelos</span> Abuelos</div>
      <div class="legend-item"><span class="badge Tio">Tio</span> Tío / Tía</div>
      <div class="legend-item"><span class="badge Nieto">Nieto</span> Nieto / Nieta</div>
      <div class="legend-item"><span class="badge Casado">Casado</span> Casado/a</div>
      <div class="legend-item"><span class="badge Bisnieto">Bisnieto</span> Bisnieto/a</div>
    </div>
  </section>
</div>

<!-- VISTA ÁRBOL GENEALÓGICO -->
<div id="view-tree" class="view-section">
  <section class="card">
    <div class="tree-toolbar">
      <div class="tree-controls">
        <button class="btn" onclick="setTreeDepth(1)">🌳 Abuelos y Tíos</button>
        <button class="btn" onclick="setTreeDepth(2)">🌿 Hasta Nietos</button>
        <button class="btn" onclick="setTreeDepth(99)">📂 Todo abierto</button>
      </div>
      <div class="tree-controls">
        <button class="btn" onclick="changeZoom(-0.15)" title="Alejar">➖</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button class="btn" onclick="changeZoom(0.15)" title="Acercar">➕</button>
        <button class="btn" onclick="resetZoom()">🎯 Centrar</button>
      </div>
    </div>
    <p style="margin:0 0 12px; color:var(--muted); font-size:0.84rem;">
      Haz clic en <strong>▼ hijos</strong> para desplegar cada rama. Arrastra el fondo para moverte por el árbol.
    </p>
    <div id="treeViewport" class="tree-viewport">
      <div id="treeStage" class="tree-stage">
        <div id="treeRoot" class="tree"></div>
      </div>
    </div>
    <div id="unlinkedContainer"></div>
  </section>
</div>

<!-- MODAL AGREGAR / EDITAR -->
<div id="personModal" class="modal-backdrop">
  <div class="modal">
    <h3 id="modalTitle">Agregar Persona</h3>
    <input type="hidden" id="f_id">
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="f_name" required>
    </div>
    <div class="form-group">
      <label>Fecha de nacimiento</label>
      <input type="date" id="f_date" required>
    </div>
    <div class="form-group">
      <label>Categoría</label>
      <select id="f_category">
        <option value="Abuelos">Abuelos</option>
        <option value="Tio">Tío / Tía</option>
        <option value="Nieto">Nieto / Nieta</option>
        <option value="Casado">Casado/a</option>
        <option value="Bisnieto">Bisnieto / Bisnieta</option>
      </select>
    </div>
    <div class="form-group">
      <label>Padre o Madre (para el árbol)</label>
      <select id="f_parent"></select>
    </div>
    <div class="form-group">
      <label>Pareja / Cónyuge (se enlaza en ambos sentidos)</label>
      <select id="f_spouse"></select>
    </div>
    <div class="modal-actions">
      <button id="btnDelete" class="btn btn-danger" style="display:none;" onclick="deletePerson()">🗑️ Eliminar</button>
      <div class="modal-actions-right">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button id="btnSaveForm" class="btn btn-primary" onclick="saveForm()">Guardar</button>
      </div>
    </div>
  </div>
</div>

const CACHE_KEY = "cruzat_people_cache_v2";
const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const shortMonths = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let PEOPLE = [];
let adminUnlocked = false;
let currentMonth = new Date().getMonth();
let currentTreeDepth = 1;
let treeZoom = 1;
let fb = null; // Instancia de Firebase cargada en segundo plano

// --- UTILIDADES SEGURAS ---
function esc(str) {
  return String(str || "").replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function parseDateParts(dateStr) {
  if (!dateStr || typeof dateStr !== "string") return null;
  const parts = dateStr.split("-").map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return null;
  return { y: parts[0], m: parts[1] - 1, d: parts[2] };
}

function formatShortDate(dateStr) {
  const p = parseDateParts(dateStr);
  return p ? `${p.d} ${shortMonths[p.m]}` : "Sin fecha";
}

function ageForYear(dateStr, targetYear = new Date().getFullYear()) {
  const p = parseDateParts(dateStr);
  return p ? targetYear - p.y : "?";
}

function sanitizePerson(p, idx = 0) {
  return {
    id: String(p.id || "p_" + (idx + 1)),
    name: String(p.name || "Sin nombre").trim(),
    date: String(p.date || "2000-01-01"),
    category: String(p.category || "Nieto"),
    parentId: p.parentId ? String(p.parentId) : "",
    spouseId: p.spouseId ? String(p.spouseId) : ""
  };
}

function setStatus(text, type = "") {
  const el = document.getElementById("syncStatus");
  el.textContent = text;
  el.className = "sync-pill " + type;
}

function saveLocalCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(PEOPLE)); } catch {}
}

// --- CARGA INSTANTÁNEA (CACHE-FIRST) + FIREBASE EN SEGUNDO PLANO ---
function bootInstant() {
  document.getElementById("today").textContent = new Date().toLocaleDateString("es-CL", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  try {
    const cached = localStorage.getItem(CACHE_KEY);
    PEOPLE = cached ? JSON.parse(cached).map(sanitizePerson) : INITIAL_BIRTHDAYS.map(sanitizePerson);
  } catch {
    PEOPLE = INITIAL_BIRTHDAYS.map(sanitizePerson);
  }

  renderAll();
  setupTreeDrag();
  initFirebaseBackground();
}

async function initFirebaseBackground() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "TU_API_KEY") {
    setStatus("⚠️ Modo local (falta firebaseConfig)", "warn");
    return;
  }
  setStatus("🔄 Sincronizando...");
  try {
    const [{ initializeApp }, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
    ]);
    const app = initializeApp(firebaseConfig);
    const db = fs.getFirestore(app);
    fb = { db, ...fs };

    const snap = await fs.getDocs(fs.collection(db, "personas"));
    if (!snap.empty) {
      const remote = snap.docs.map((d, i) => sanitizePerson({ id: d.id, ...d.data() }, i));
      PEOPLE = remote;
      saveLocalCache();
      renderAll();
      setStatus("🟢 En línea", "ok");
    } else {
      setStatus("🟡 Firebase vacío (usa Sincronizar en Admin)", "warn");
    }
  } catch (e) {
    console.error("Error Firebase:", e);
    setStatus("⚠️ Sin conexión a Firebase (caché)", "warn");
  }
}

function renderAll() {
  document.getElementById("statsLabel").textContent = `${PEOPLE.length} integrantes`;
  renderNav();
  renderMonth(currentMonth);
  renderUpcoming();
  renderTree(currentTreeDepth);
}

// --- CALENDARIO ---
function renderNav() {
  const nav = document.getElementById("monthNav");
  const counts = Array(12).fill(0);
  PEOPLE.forEach(p => { const d = parseDateParts(p.date); if (d) counts[d.m]++; });

  nav.innerHTML = monthNames.map((mn, idx) =>
    `<button class="${idx === currentMonth ? 'active' : ''}" onclick="selectMonth(${idx})">${mn} <span class="m-count">${counts[idx]}</span></button>`
  ).join("");
}

function selectMonth(idx) {
  currentMonth = idx;
  renderNav();
  renderMonth(idx);
}

function renderMonth(monthIndex) {
  const container = document.getElementById("monthsContainer");
  const year = new Date().getFullYear();
  const firstDay = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  const today = new Date();

  const byDay = {};
  PEOPLE.forEach(p => {
    const parts = parseDateParts(p.date);
    if (parts && parts.m === monthIndex) {
      if (!byDay[parts.d]) byDay[parts.d] = [];
      byDay[parts.d].push(p);
    }
  });

  let html = `<h3 class="section-title" style="justify-content:center; font-size:1.25rem; color:var(--primary);">${monthNames[monthIndex]} ${year}</h3>`;
  html += `<div class="weekdays-header"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div>`;
  html += `<div class="calendar-grid">`;

  for (let i = 0; i < firstDay; i++) {
    html += `<div class="day inactive"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today.getDate() && monthIndex === today.getMonth();
    const list = byDay[d] || [];
    const wd = new Date(year, monthIndex, d).toLocaleDateString("es-CL", { weekday: "long" });
    const cls = `day ${isToday ? 'today' : ''} ${list.length === 0 ? 'no-events' : ''}`;

    html += `<div class="${cls}"><div class="day-head"><span class="num">${d}</span><span class="weekday-mobile">${wd}</span></div>`;
    list.forEach(b => {
      const cat = b.category.replace(/\s+/g, "");
      html += `<div class="badge ${esc(cat)}" onclick="onBadgeClick('${esc(b.id)}')">${esc(b.name)} (${ageForYear(b.date, year)})</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

function renderUpcoming() {
  const listEl = document.getElementById("upcomingList");
  const today = new Date();
  const upcoming = [];

  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const m = d.getMonth(), day = d.getDate(), yr = d.getFullYear();
    PEOPLE.forEach(p => {
      const parts = parseDateParts(p.date);
      if (parts && parts.m === m && parts.d === day) {
        upcoming.push({ person: p, daysLeft: i, dateObj: d, turningAge: ageForYear(p.date, yr) });
      }
    });
  }

  if (!upcoming.length) {
    listEl.innerHTML = `<div style="color:var(--muted); font-size:0.9rem;">No hay cumpleaños en los próximos 14 días.</div>`;
    return;
  }

  listEl.innerHTML = upcoming.map(({ person, daysLeft, dateObj, turningAge }) => {
    const label = daysLeft === 0 ? "¡HOY! 🎂" : daysLeft === 1 ? "Mañana" : `En ${daysLeft} días`;
    const dateTxt = dateObj.toLocaleDateString("es-CL", { weekday: "short", day: "numeric", month: "long" });
    const cat = person.category.replace(/\s+/g, "");
    return `<div class="upcomingCard ${daysLeft === 0 ? 'is-today' : ''}">
      <span class="countdown-tag">${label}</span>
      <strong style="font-size:0.92rem;">${esc(person.name)}</strong>
      <div style="color:var(--muted);">${dateTxt} • Cumple <strong>${turningAge}</strong></div>
      <span class="badge ${esc(cat)}" style="align-self:flex-start;" onclick="onBadgeClick('${esc(person.id)}')">${esc(person.category)}</span>
    </div>`;
  }).join("");
}

function renderSearch() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const box = document.getElementById("searchResults");
  if (!q) { box.innerHTML = ""; return; }
  const matches = PEOPLE.filter(p => p.name.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) {
    box.innerHTML = `<small style="color:var(--muted);">Sin resultados para "${esc(q)}"</small>`;
    return;
  }
  box.innerHTML = matches.map(p => {
    const cat = p.category.replace(/\s+/g, "");
    return `<span class="badge ${esc(cat)}" onclick="jumpToPerson('${esc(p.id)}')">${esc(p.name)} — ${formatShortDate(p.date)} (${ageForYear(p.date)} años)</span>`;
  }).join("");
}

function jumpToPerson(id) {
  if (adminUnlocked) { openModal(id); return; }
  const p = PEOPLE.find(x => x.id === id);
  const parts = p && parseDateParts(p.date);
  if (parts) { selectMonth(parts.m); }
}

function onBadgeClick(id) {
  if (adminUnlocked) openModal(id);
}

// ================= ÁRBOL GENEALÓGICO =================
function renderTree(expandDepth = currentTreeDepth) {
  currentTreeDepth = expandDepth;
  const root = document.getElementById("treeRoot");
  const unlinkedBox = document.getElementById("unlinkedContainer");
  const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
  const rendered = new Set();

  // Busca pareja aunque esté enlazada en un solo sentido
  function findSpouse(person) {
    if (person.spouseId && byId[person.spouseId] && !rendered.has(person.spouseId)) {
      return byId[person.spouseId];
    }
    return PEOPLE.find(p => p.id !== person.id && p.spouseId === person.id && !rendered.has(p.id)) || null;
  }

  function buildNode(person, depth = 0) {
    if (rendered.has(person.id)) return "";
    rendered.add(person.id);

    const spouse = findSpouse(person);
    if (spouse) rendered.add(spouse.id);

    const children = PEOPLE
      .filter(c => c.id !== person.id && (!spouse || c.id !== spouse.id) &&
        (c.parentId === person.id || (spouse && c.parentId === spouse.id)))
      .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

    const isAbuelos = person.category === "Abuelos";
    const isCollapsed = depth >= expandDepth;
    const cat = person.category.replace(/\s+/g, "");

    let html = `<li><div class="person-node ${isAbuelos ? 'abuelos-node' : ''}">
      <span class="badge ${esc(cat)}">${esc(person.category)}</span>
      <strong>${esc(person.name)}</strong>
      <div class="person-meta">${formatShortDate(person.date)} • ${ageForYear(person.date)} años</div>
      <button class="edit-icon" onclick="openModal('${esc(person.id)}')">✏️ Editar</button>`;

    if (spouse) {
      html += `<div class="spouse-tag">💍 ${esc(spouse.name)}<br><small>${formatShortDate(spouse.date)} (${ageForYear(spouse.date)})</small>
        <div><button class="edit-icon" onclick="openModal('${esc(spouse.id)}')">✏️ Editar</button></div></div>`;
    }

    if (children.length > 0) {
      const label = isCollapsed
        ? `▼ ${children.length} hijo${children.length > 1 ? 's' : ''}`
        : `▲ Ocultar (${children.length})`;
      html += `<button class="branch-toggle" data-count="${children.length}" onclick="toggleBranch(this)">${label}</button>`;
    }

    html += `</div>`;

    if (children.length > 0) {
      html += `<ul class="${isCollapsed ? 'collapsed' : ''}">` +
        children.map(c => buildNode(c, depth + 1)).join("") +
        `</ul>`;
    }
    return html + `</li>`;
  }

  const abuelos = PEOPLE.filter(p => p.category === "Abuelos" && !p.parentId);
  const mainRoots = abuelos.length ? abuelos : PEOPLE.filter(p => !p.parentId);

  root.innerHTML = `<ul>` + mainRoots.map(r => buildNode(r, 0)).join("") + `</ul>`;

  const unlinked = PEOPLE.filter(p => !rendered.has(p.id)).sort((a,b) => a.name.localeCompare(b.name));
  if (unlinked.length > 0) {
    unlinkedBox.innerHTML = `<div class="unlinked-box">
      <h4>🔗 Pendientes de enlazar al árbol (${unlinked.length}) — activa Modo Admin y asigna su pareja o padre:</h4>
      <div class="unlinked-list">` +
      unlinked.map(p => `<div class="person-node">
        <span class="badge ${esc(p.category.replace(/\s+/g,''))}">${esc(p.category)}</span>
        <strong>${esc(p.name)}</strong>
        <div class="person-meta">${formatShortDate(p.date)}</div>
        <button class="edit-icon" onclick="openModal('${esc(p.id)}')">✏️ Enlazar</button>
      </div>`).join("") +
      `</div></div>`;
  } else {
    unlinkedBox.innerHTML = "";
  }

  requestAnimationFrame(centerTreeViewport);
}

function toggleBranch(btn) {
  const li = btn.closest("li");
  const ul = li.querySelector(":scope > ul");
  if (!ul) return;
  const count = btn.getAttribute("data-count");
  const collapsed = ul.classList.toggle("collapsed");
  btn.textContent = collapsed ? `▼ ${count} hijo${count > 1 ? 's' : ''}` : `▲ Ocultar (${count})`;
}

function setTreeDepth(depth) {
  renderTree(depth);
}

function changeZoom(delta) {
  treeZoom = Math.min(1.4, Math.max(0.45, +(treeZoom + delta).toFixed(2)));
  document.getElementById("treeStage").style.transform = `scale(${treeZoom})`;
  document.getElementById("zoomLabel").textContent = Math.round(treeZoom * 100) + "%";
}

function resetZoom() {
  treeZoom = 1;
  document.getElementById("treeStage").style.transform = "scale(1)";
  document.getElementById("zoomLabel").textContent = "100%";
  centerTreeViewport();
}

function centerTreeViewport() {
  const vp = document.getElementById("treeViewport");
  if (!vp) return;
  vp.scrollLeft = Math.max(0, (vp.scrollWidth - vp.clientWidth) / 2);
}

function setupTreeDrag() {
  const vp = document.getElementById("treeViewport");
  let isDown = false, startX = 0, startY = 0, scrollL = 0, scrollT = 0;
  vp.addEventListener("mousedown", e => {
    if (e.target.closest("button")) return;
    isDown = true; vp.classList.add("grabbing");
    startX = e.pageX - vp.offsetLeft; startY = e.pageY - vp.offsetTop;
    scrollL = vp.scrollLeft; scrollT = vp.scrollTop;
  });
  window.addEventListener("mouseup", () => { isDown = false; vp.classList.remove("grabbing"); });
  vp.addEventListener("mousemove", e => {
    if (!isDown) return;
    e.preventDefault();
    vp.scrollLeft = scrollL - (e.pageX - vp.offsetLeft - startX);
    vp.scrollTop = scrollT - (e.pageY - vp.offsetTop - startY);
  });
}

// ================= ADMIN, CORREO Y GUARDADO =================
function toggleAdmin() {
  if (adminUnlocked) {
    adminUnlocked = false;
    document.body.classList.remove("is-admin");
    document.getElementById("btnAdmin").textContent = "🔒 Modo Admin";
    document.getElementById("btnAdmin").classList.remove("unlocked");
    document.getElementById("btnAdd").style.display = "none";
    document.getElementById("btnSeed").style.display = "none";
    return;
  }
  const pass = prompt("Ingresa la clave de administrador:");
  if (pass === "dinosaurio") {
    adminUnlocked = true;
    document.body.classList.add("is-admin");
    document.getElementById("btnAdmin").textContent = "🔓 Admin Activo";
    document.getElementById("btnAdmin").classList.add("unlocked");
    document.getElementById("btnAdd").style.display = "inline-flex";
    document.getElementById("btnSeed").style.display = "inline-flex";
  } else if (pass !== null) {
    alert("Clave incorrecta.");
  }
}

async function subscribeEmail() {
  const email = prompt("Ingresa tu correo para recibir avisos los días de cumpleaños:");
  if (!email || !email.includes("@")) return;
  const clean = email.trim().toLowerCase();
  if (!fb) return alert("Aún no se conecta a Firebase. Revisa tu firebaseConfig.");
  try {
    await fb.setDoc(fb.doc(fb.db, "suscriptores", clean), {
      email: clean, createdAt: new Date().toISOString()
    });
    alert("¡Listo! Te avisaremos por correo cada vez que haya cumpleaños.");
  } catch (e) {
    alert("Error al guardar el correo. Revisa las reglas de Firestore.");
  }
}

function openModal(personId = null) {
  if (!adminUnlocked) return;
  const p = personId ? PEOPLE.find(x => x.id === personId) : null;
  document.getElementById("modalTitle").textContent = p ? "Editar Persona" : "Agregar Persona";
  document.getElementById("f_id").value = p ? p.id : "";
  document.getElementById("f_name").value = p ? p.name : "";
  document.getElementById("f_date").value = p ? p.date : "";
  document.getElementById("f_category").value = p ? p.category : "Bisnieto";
  document.getElementById("btnDelete").style.display = p ? "inline-flex" : "none";

  const sorted = [...PEOPLE]
    .filter(x => !p || x.id !== p.id)
    .sort((a, b) => a.name.localeCompare(b.name));
  const optionsHtml = `<option value="">-- Ninguno --</option>` +
    sorted.map(x => `<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.category)})</option>`).join("");

  document.getElementById("f_parent").innerHTML = optionsHtml;
  document.getElementById("f_spouse").innerHTML = optionsHtml;
  document.getElementById("f_parent").value = p ? (p.parentId || "") : "";
  document.getElementById("f_spouse").value = p ? (p.spouseId || "") : "";
  document.getElementById("personModal").classList.add("open");
}

function closeModal() {
  document.getElementById("personModal").classList.remove("open");
}

async function saveForm() {
  const id = document.getElementById("f_id").value || "p_" + Date.now();
  const prev = PEOPLE.find(x => x.id === id);
  const oldSpouseId = prev ? prev.spouseId : "";

  const person = sanitizePerson({
    id,
    name: document.getElementById("f_name").value.trim(),
    date: document.getElementById("f_date").value,
    category: document.getElementById("f_category").value,
    parentId: document.getElementById("f_parent").value,
    spouseId: document.getElementById("f_spouse").value
  });

  if (!person.name || !person.date) return alert("Completa nombre y fecha.");

  const btn = document.getElementById("btnSaveForm");
  btn.disabled = true; btn.textContent = "Guardando...";

  try {
    // Actualiza en memoria local (incluyendo pareja bidireccional)
    const idx = PEOPLE.findIndex(x => x.id === person.id);
    if (idx >= 0) PEOPLE[idx] = person; else PEOPLE.push(person);

    const toSync = [person];
    if (oldSpouseId && oldSpouseId !== person.spouseId) {
      const oldSp = PEOPLE.find(x => x.id === oldSpouseId);
      if (oldSp && oldSp.spouseId === person.id) {
        oldSp.spouseId = "";
        toSync.push(oldSp);
      }
    }
    if (person.spouseId) {
      const newSp = PEOPLE.find(x => x.id === person.spouseId);
      if (newSp && newSp.spouseId !== person.id) {
        newSp.spouseId = person.id;
        toSync.push(newSp);
      }
    }

    saveLocalCache();

    if (fb) {
      const batch = fb.writeBatch(fb.db);
      toSync.forEach(item => batch.set(fb.doc(fb.db, "personas", item.id), item));
      await batch.commit();
      setStatus("🟢 Guardado", "ok");
    }

    closeModal();
    renderAll();
  } catch (e) {
    console.error(e);
    alert("Error al guardar en Firebase.");
  } finally {
    btn.disabled = false; btn.textContent = "Guardar";
  }
}

async function deletePerson() {
  const id = document.getElementById("f_id").value;
  const p = PEOPLE.find(x => x.id === id);
  if (!p || !confirm(`¿Seguro que quieres eliminar a ${p.name}?`)) return;

  try {
    PEOPLE = PEOPLE.filter(x => x.id !== id);
    PEOPLE.forEach(x => {
      if (x.spouseId === id) x.spouseId = "";
      if (x.parentId === id) x.parentId = "";
    });
    saveLocalCache();
    if (fb) {
      await fb.deleteDoc(fb.doc(fb.db, "personas", id));
      setStatus("🟢 Eliminado", "ok");
    }
    closeModal();
    renderAll();
  } catch (e) {
    alert("Error al eliminar en Firebase.");
  }
}

async function syncInitialToFirebase() {
  if (!adminUnlocked) return;
  if (!fb) return alert("Firebase aún no está conectado. Revisa tus claves en firebaseConfig.");

  // Mezcla: mantiene los cambios existentes y agrega a cualquiera de los 152 que falte
  const existingIds = new Set(PEOPLE.map(p => p.id));
  const missing = INITIAL_BIRTHDAYS.filter(p => !existingIds.has(p.id)).map(sanitizePerson);
  const fullList = [...PEOPLE, ...missing];

  if (!confirm(`Se sincronizarán ${fullList.length} personas en un solo paquete rápido hacia Firebase. ¿Continuar?`)) return;

  setStatus("🔄 Subiendo paquete...");
  try {
    const batch = fb.writeBatch(fb.db);
    fullList.forEach(p => batch.set(fb.doc(fb.db, "personas", p.id), p));
    await batch.commit();
    PEOPLE = fullList;
    saveLocalCache();
    renderAll();
    setStatus("🟢 En línea", "ok");
    alert(`¡Listo! Quedaron ${fullList.length} personas guardadas en Firebase en menos de 1 segundo.`);
  } catch (e) {
    console.error(e);
    alert("Error al sincronizar. Verifica las reglas de Firestore.");
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll(".view-section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("view-" + tab).classList.add("active");
  btn.classList.add("active");
  if (tab === "tree") requestAnimationFrame(centerTreeViewport);
}

// Arranque inmediato
bootInstant();
